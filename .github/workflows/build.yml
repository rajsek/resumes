name: Build resume PDFs

# Rebuilds every PDF when resume content changes and commits them to pdf/.
# The commit touches only pdf/, which is not in the trigger paths, so it cannot loop.
on:
  push:
    paths:
      - 'shared/**'
      - '1-page/**'
      - '2-page/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils

      - name: Compile all resumes
        run: |
          set -e
          mkdir -p pdf
          for group in 1-page 2-page; do
            for f in "$group"/*.tex; do
              name=$(basename "$f" .tex)
              echo "== $group/$name =="
              (cd "$group" && pdflatex -interaction=nonstopmode -halt-on-error "$name.tex" > /dev/null)
              pages=$(pdfinfo "$group/$name.pdf" | awk '/^Pages/ {print $2}')
              echo "   pages: $pages"
              if [ "$group" = "1-page" ] && [ "$pages" != "1" ]; then
                echo "::error::1-page/$name.pdf came out as $pages pages"
                exit 1
              fi
              if [ "$group" = "2-page" ] && [ "$pages" -gt 2 ]; then
                echo "::error::2-page/$name.pdf came out as $pages pages"
                exit 1
              fi
              mv "$group/$name.pdf" "pdf/${group}-${name}.pdf"
            done
          done

      - name: Commit built PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --cached --quiet; then
            echo "PDFs unchanged"
          else
            git commit -m "Rebuild resume PDFs"
            # actions/checkout leaves a detached HEAD; push it back to the triggering branch
            git push origin HEAD:${{ github.ref_name }}
          fi
