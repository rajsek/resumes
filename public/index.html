<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Studio</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1a1a1a; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #202124; color: #fff; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header select, header button { font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid #555; background: #fff; cursor: pointer; }
  header select { cursor: default; }
  #status { margin-left: auto; font-size: 13px; opacity: .9; }
  #status.ok { color: #9be29b; }
  #status.err { color: #ff9b9b; }
  main { display: grid; grid-template-columns: 230px 1fr 1fr; height: calc(100vh - 45px); }
  #files { border-right: 1px solid #ddd; overflow-y: auto; padding: 8px 0; }
  #files h2 { font-size: 11px; text-transform: uppercase; color: #777; margin: 10px 14px 4px; }
  #files .f { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: ui-monospace, monospace; }
  #files .f:hover { background: #f0f0f0; }
  #files .f.active { background: #e3ecff; font-weight: 600; }
  #editor { display: flex; flex-direction: column; border-right: 1px solid #ddd; }
  #editor textarea { flex: 1; border: 0; resize: none; outline: none; padding: 12px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; line-height: 1.5; }
  #previewWrap { display: flex; flex-direction: column; background: #525659; }
  #preview { flex: 1; border: 0; width: 100%; }
  #errlog { max-height: 40%; overflow: auto; background: #2b0000; color: #ffb3b3; font: 12px ui-monospace, monospace; padding: 10px; white-space: pre-wrap; margin: 0; display: none; }
</style>
</head>
<body>
<div id="root">Loading...</div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
