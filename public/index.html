<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Studio</title>
<style>
  /* Print-shop palette: paper, ink, and proofreader's red */
  :root {
    --paper: #F7F6F2;      /* app background */
    --sheet: #FFFFFF;      /* panels */
    --ink: #1B1D21;        /* text */
    --ink-soft: #5C6066;   /* secondary text */
    --rule: #E3E0D8;       /* borders */
    --red: #A63A1B;        /* proofreader red: actions, errors */
    --red-soft: #F6E7E0;
    --green: #256D46;
    --green-soft: #E4EFE8;
    --preview-bg: #E9E6DF; /* desk behind the page */
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--paper); font-size: 14px; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }

  header { display: flex; align-items: baseline; gap: 14px; padding: 10px 18px;
           background: var(--sheet); border-bottom: 1px solid var(--rule); }
  .wordmark { font-family: var(--serif); font-size: 19px; letter-spacing: .2px; }
  .wordmark em { font-style: normal; color: var(--red); }
  header .spacer { flex: 1; }
  select, button { font: 13px var(--sans); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  select { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
  .btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
  .btn:hover { border-color: var(--ink-soft); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { background: #8F3116; }
  .btn:disabled { opacity: .45; cursor: default; }
  a { text-decoration: none; }

  #status { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 7px; }
  #status.ok { color: var(--green); }
  #status.err { color: var(--red); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
  @media (prefers-reduced-motion: no-preference) {
    .dot.busy { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  }

  main { display: grid; grid-template-columns: 240px minmax(0,1fr) minmax(0,1fr); height: calc(100vh - 52px); }

  /* file rail */
  #files { background: var(--sheet); border-right: 1px solid var(--rule); overflow-y: auto; padding: 10px 0 20px; }
  #files h2 { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 14px 16px 4px; }
  #files .hint { font-size: 11.5px; color: var(--ink-soft); margin: 0 16px 6px; line-height: 1.4; }
  .f { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none;
       padding: 6px 16px; font: 12.5px var(--mono); color: var(--ink); text-align: left; border-radius: 0; }
  .f:hover { background: var(--paper); }
  .f.active { background: var(--red-soft); color: var(--red); font-weight: 600; }
  .f .feeds { margin-left: auto; font: 10.5px var(--sans); color: var(--ink-soft); }

  /* editor */
  #editor { display: flex; flex-direction: column; border-right: 1px solid var(--rule); min-width: 0; }
  #editor textarea { flex: 1; border: 0; resize: none; outline: none; padding: 16px 18px;
                     font: 13px/1.6 var(--mono); color: var(--ink); background: var(--sheet); }
  #editorBar { display: flex; align-items: center; gap: 10px; padding: 6px 14px; font-size: 12px;
               color: var(--ink-soft); background: var(--sheet); border-top: 1px solid var(--rule); }
  #editorBar .path { font-family: var(--mono); }
  #editorBar .right { margin-left: auto; }
  .dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); display: inline-block; }

  /* preview desk */
  #desk { display: flex; flex-direction: column; background: var(--preview-bg); min-width: 0; }
  #preview { flex: 1; border: 0; width: 100%; }
  #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 10px; color: var(--ink-soft); text-align: center; padding: 30px; }
  #empty .big { font-family: var(--serif); font-size: 20px; color: var(--ink); }
  #errlog { max-height: 45%; overflow: auto; background: #2A0E06; color: #F5B9A4; margin: 0;
            font: 12px/1.5 var(--mono); padding: 12px 16px; white-space: pre-wrap; border-top: 3px solid var(--red); }
  #errHead { background: var(--red); color: #fff; font-size: 12.5px; padding: 7px 16px; }
  #deskBar { display: flex; align-items: center; gap: 10px; padding: 6px 14px; font-size: 12px;
             color: var(--ink-soft); background: var(--sheet); border-top: 1px solid var(--rule); }
  #deskBar .pill { background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 2px 10px; font-weight: 600; }
  #deskBar .pill.warn { background: var(--red-soft); color: var(--red); }

  #loading { display: flex; height: 100vh; align-items: center; justify-content: center;
             font-family: var(--serif); font-size: 18px; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="root"><div id="loading">Setting type...</div></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
